name: Build TaskFlow APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Check Android project
        working-directory: android
        run: |
          echo "Android project directory:"
          pwd
          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Build TaskFlow APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check generated APK
        run: |
          echo "Generated APK:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload TaskFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
